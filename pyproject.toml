[project]
name = "aisc-plugin-langbite"
version = "0.2.4"
description = "LangBiTe bias testing as an AISC plugin: the target through its Manage endpoint, a judge of its own"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aisc-plugin-interface>=0.2.7",
    "gpt4all>=2.8.2",
    "jsonschema>=4.25.1",
    "mypy>=1.11",
    "numpy>=2.3.5",
    "ollama>=0.3.0",
    "openai>=2.11.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "replicate>=1.0.7",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Without an explicit build backend the wheel built by `uv run --with` dropped
# langbite's subpackages (io_managers, llm_services, ...), breaking the plugin
# at eval time. Bundle the whole package tree explicitly.
[tool.hatch.build.targets.wheel]
packages = ["langbite", "aisc_plugin_langbite"]
